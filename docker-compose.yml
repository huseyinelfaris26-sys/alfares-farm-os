services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: farm
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-farm_secret}
    volumes:
      - db_data:/var/lib/postgresql/data

  farmos:
    image: farmos/farmos:3.x
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      XDEBUG_MODE: off
    volumes:
      - farmos_sites:/var/www/html/sites

  weather:
    build: ./services/weather-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - FARMOS_URL=${FARMOS_URL:-http://farmos}
      - FARMOS_CLIENT_ID=${FARMOS_CLIENT_ID}
      - FARMOS_CLIENT_SECRET=${FARMOS_CLIENT_SECRET}

  disease:
    build: ./services/disease-service
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - HF_MODEL_ID=${HF_MODEL_ID:-linkanjarad/mobilenet_v2_1.0_224-plant-disease-identification}

  fertilizer:
    build: ./services/fertilizer-service
    restart: unless-stopped
    ports:
      - "8003:8000"

  ndvi:
    build: ./services/ndvi-service
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - SH_CLIENT_ID=${SH_CLIENT_ID}
      - SH_CLIENT_SECRET=${SH_CLIENT_SECRET}

volumes:
  db_data:
  farmos_sites:
